  /* Embedded directly (not local()) -- local() silently fails to match these
     static-instance TTFs against the macOS font cache in this environment,
     which was causing EVERY SemiBold/Medium/Light run (~1,400 of ~3,000 in
     this deck) to silently degrade to plain Regular weight. Embedding the
     exact font file sidesteps OS font-cache/matching entirely. */
  @font-face { font-family: 'Lexend'; src: url('assets/fonts/Lexend-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Lexend'; src: url('assets/fonts/Lexend-Bold.ttf') format('truetype'); font-weight: 700; }

  @font-face { font-family: 'Lexend SemiBold'; src: url('assets/fonts/Lexend-SemiBold.ttf') format('truetype'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e8e6f4; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .tx-slide { width:1280px; height:720px; position:relative; overflow:hidden; background:#FFFFFF; background:url('assets/bg_140281829587600.png') center/cover no-repeat; }
</style>
