<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Class Deck Viewer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#1c1b2e; overflow:hidden; font-family:-apple-system,sans-serif; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  iframe { width:1280px; height:720px; border:0; border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,.5); background:#fff; transform-origin:center center; }
  #nav { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:14px;
         background:rgba(255,255,255,.08); backdrop-filter:blur(8px); padding:10px 18px; border-radius:999px; color:#fff; }
  #nav button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; opacity:.8; }
  #nav button:hover { opacity:1; }
  #count { font-size:12px; letter-spacing:.05em; opacity:.75; min-width:64px; text-align:center; }
  #dots { display:flex; gap:6px; }
  #dots span { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.3); cursor:pointer; }
  #dots span.active { background:#fff; }
</style>
</head>
<body>
<div id="stage"><iframe id="frame"></iframe></div>
<div id="nav">
  <button id="prev">◀</button>
  <span id="count">1 / 1</span>
  <div id="dots"></div>
  <button id="next">▶</button>
</div>
<script>
  // Set this to the deck you want to view — e.g. './'
  const DECK = new URLSearchParams(location.search).get('deck') || './';

  let slides = [];
  let idx = 0;

  function scaleFrame() {
    const frame = document.getElementById('frame');
    const pad = 90;
    const sx = (window.innerWidth - pad) / 1280;
    const sy = (window.innerHeight - pad) / 720;
    const s = Math.min(sx, sy, 1.4);
    frame.style.transform = `scale(${s})`;
  }

  function renderDots() {
    const dots = document.getElementById('dots');
    dots.innerHTML = slides.map((_, i) => `<span data-i="${i}"></span>`).join('');
    [...dots.children].forEach(el => el.addEventListener('click', () => goTo(+el.dataset.i)));
  }

  function goTo(i) {
    idx = Math.max(0, Math.min(slides.length - 1, i));
    document.getElementById('frame').src = DECK + slides[idx] + '?s=' + Date.now();
    document.getElementById('count').textContent = `${idx + 1} / ${slides.length}`;
    [...document.getElementById('dots').children].forEach((el, i2) => el.classList.toggle('active', i2 === idx));
    history.replaceState(null, '', '?deck=' + encodeURIComponent(DECK) + '&s=' + (idx + 1));
  }

  document.getElementById('prev').onclick = () => goTo(idx - 1);
  document.getElementById('next').onclick = () => goTo(idx + 1);
  window.addEventListener('keydown', e => {
    if (['ArrowRight', ' '].includes(e.key)) goTo(idx + 1);
    if (e.key === 'ArrowLeft') goTo(idx - 1);
  });
  window.addEventListener('resize', scaleFrame);

  fetch(DECK + 'deck.json')
    .then(r => r.json())
    .then(manifest => {
      slides = manifest.slides;
      renderDots();
      const startSlide = +(new URLSearchParams(location.search).get('s') || 1) - 1;
      scaleFrame();
      goTo(startSlide);
    })
    .catch(err => {
      document.body.innerHTML = `<div style="color:#fff;padding:40px;font-family:sans-serif">
        Could not load ${DECK}deck.json — serve this folder over HTTP (python3 -m http.server), not file://.<br><br>${err}</div>`;
    });
</script>
</body>
</html>
